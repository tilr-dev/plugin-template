version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # SDK bumps get a PR of their own, so they are easy to see and review.
      tilr-sdk:
        patterns:
          - '@tilr-dev/plugin'
      # oxlint-tsgolint is built on one TypeScript release: the three move together.
      typescript-oxlint:
        patterns:
          - 'typescript'
          - 'oxlint'
          - 'oxlint-tsgolint'
      npm:
        patterns:
          - '*'
        exclude-patterns:
          - '@tilr-dev/plugin'
          - 'typescript'
          - 'oxlint'
          - 'oxlint-tsgolint'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
